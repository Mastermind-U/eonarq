name: CI and container

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [imports, format, lint, mypy]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.1"
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: uv sync --locked
      - if: matrix.check == 'imports'
        run: uv run lint-imports
      - if: matrix.check == 'format'
        run: uv run ruff format --check src tests
      - if: matrix.check == 'lint'
        run: uv run ruff check --output-format=github src tests
      - if: matrix.check == 'mypy'
        run: |
          uv run mypy --platform linux src tests
          uv run mypy --platform win32 src tests

  unit_tests:
    name: Unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.1"
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: uv sync --locked
      - run: uv run pytest tests/units -q

  integration_tests:
    name: SQLite, HTTP and MCP (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.1"
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: uv sync --locked
      - run: uv run pytest tests/integrations -q

  browser_tests:
    name: Browser interactions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.1"
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: uv sync --locked
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest tests/browser -n 0 -q

  container:
    name: Build and publish GHCR image
    needs: [quality, unit_tests, integration_tests, browser_tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ghcr.io/mastermind-u/eonarq
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: eonarq:ci
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check packaged runtime
        run: |
          docker run -d --name eonarq-ci -p 127.0.0.1:8765:8765 eonarq:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/health; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8765/health
          curl --fail --silent http://127.0.0.1:8765/static/app.js > /dev/null
          curl --fail --silent -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            http://127.0.0.1:8765/mcp
      - name: Publish tested image
        if: github.event_name != 'pull_request'
        env:
          IMAGE_TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            docker tag eonarq:ci "$tag"
            docker push "$tag"
          done <<< "$IMAGE_TAGS"
      - name: Container logs
        if: failure()
        run: docker logs eonarq-ci
