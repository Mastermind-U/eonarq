[project]
name = "eonarq"
version = "0.1.0"
description = "Local epic and prompt tracker with an MCP server"
readme = "README.md"
requires-python = ">=3.14"
license = "GPL-3.0-only"
dependencies = [
    "alembic>=1.18.4,<2",
    "dature>=1.6.0,<2",
    "dishka>=1.9.1,<2",
    "fastapi>=0.143.0,<1",
    "jinja2>=3.1.6,<4",
    "mcp>=1.26,<2",
    "sqlalchemy>=2.1.4,<2.2",
    "uvicorn>=0.54.0,<1",
]

[project.scripts]
eonarq = "eonarq.cli:main"

[build-system]
requires = ["uv_build>=0.11.1,<0.12"]
build-backend = "uv_build"

[dependency-groups]
linters = ["import-linter>=2.11", "mypy>=1.20.0", "ruff>=0.15.10"]
test = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-xdist>=3.8",
    "coverage>=7.16.2",
    "playwright>=1.55",
    "httpx2>=1.0",
]

[tool.uv]
default-groups = ["linters", "test"]

[tool.mypy]
disallow_untyped_defs = true
show_column_numbers = true
pretty = true
warn_unreachable = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n auto --maxprocesses=4"

[tool.coverage.run]
branch = true
source = ["eonarq"]

[tool.ruff]
target-version = "py314"
line-length = 79
output-format = "grouped"
unsafe-fixes = true

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 79
line-ending = "lf"
skip-magic-trailing-comma = false # default: false

[tool.ruff.lint]
select = [
    "F",      # Pyflakes.
    "E",      # pycodestyle (Error), check tool.ruff.lint.pycodestyle. Must have
    "W",      # pycodestyle (Warnings), check tool.ruff.lint.pycodestyle
    "C90",    # mccabe (max_complexity), check tool.ruff.lint.mccabe
    "I",      # isort, check tool.ruff.lint.isort. Must have
    "N",      # pep8-naming
    "A",      # flake8 builtin-attribute-shadowing
    "D",      # pydocstyle, check tool.ruff.lint.pydocstyle
    "UP",     # pyupgrade, check tool.ruff.lint.pyupgrade. Must have
    "ANN",    # flake8-annotations, check tool.ruff.lint.flake8-annotations
    "ASYNC",  # flake8-async
    "S",      # flake8-bandit
    "B",      # flake8-bugbear. Must have
    "COM",    # flake8-commas
    "PIE",    # flake8-pie
    "PT",     # flake8-pytest
    "Q",      # flake8-quotes
    "SIM",    # flake8-simplify. Must have
    "TC",     # flake8-type-checking, check flake8-type-checking
    "ARG",    # flake8-unused-arguments
    "FIX",    # flake8-fixme
    "T20",    # flake8-print
    "ERA",    # eradicate
    "RUF100", # Ruff100-specific rule TODO delete that and uncomment "RUF"-rule in line up.
    "SLF001", # flake8-self: checks for access to private/protected attributes via self
    "COM812", # this is necessary. It checks for commas in the end of the line.
]

# Gradually remove all values marked 'TODO' and fix errors.
ignore = [
    "D100",
    "D102",
    "D104",
    "D203",     # this is necessary. Conflict with `D211`
    "D213",     # this is necessary. Conflict with `D212`
    "D301",     # this is necessary.
    "UP017",
    "UP034",
    "UP035",    # this is necessary. We allowed deprecated import
    "ANN001",
    "ANN002",   # this is necessary.
    "ANN003",   # this is necessary.
    "ANN401",
    "ASYNC109",
    "ASYNC230",
    "S311",     # this is necessary.
    "B904",     # this is necessary.
    "TC001",    # this is necessary.
    "TC002",    # this is necessary.
    "TC003",    # this is necessary.
    "SIM101",   # analogue simplify-boolean-expressions IF100
    "B905",     # this is necessary. get-attr-with-constant
    "D107",     # ignore missing docstrings in __init__ methods
    "D101",     # ignore missing docstrings in public classes
    "D103",     # ignore missing docstrings in public functions
]

extend-select = []

fixable = ["ALL"]
unfixable = [
    "T20", # dont auto delete print/pprint lines in code
]


[tool.ruff.lint.flake8-unused-arguments]
ignore-variadic-names = true

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["S101"] # Allow assert statements in test files.
[tool.ruff.lint.mccabe]
# Allow functions with complexity up to 15 before Ruff flags them as too complex.
max-complexity = 15

[tool.ruff.lint.isort]
known-first-party = ["eonarq"]
known-third-party = [
    "alembic", # Treat Alembic as a third-party dependency for import grouping.
]

split-on-trailing-comma = false
combine-as-imports = true

[tool.ruff.lint.flake8-annotations]
suppress-dummy-args = true
suppress-none-returning = true

[tool.ruff.lint.flake8-type-checking]
quote-annotations = true

[tool.importlinter]
root_package = "eonarq"
include_external_packages = true
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "CQRS layers point inward"
type = "layers"
layers = ["presentation | infrastructure", "application", "domain"]
containers = ["eonarq.planning.command", "eonarq.planning.query", "eonarq.planning.common", "eonarq.shared_kernel"]

[[tool.importlinter.contracts]]
name = "Command and query are independent"
type = "independence"
modules = ["eonarq.planning.command", "eonarq.planning.query"]

[[tool.importlinter.contracts]]
name = "Common imports neither slice"
type = "forbidden"
source_modules = ["eonarq.planning.common"]
forbidden_modules = ["eonarq.planning.command", "eonarq.planning.query"]

[[tool.importlinter.contracts]]
name = "Shared kernel imports no contexts"
type = "forbidden"
source_modules = ["eonarq.shared_kernel"]
forbidden_modules = ["eonarq.planning"]

[[tool.importlinter.contracts]]
name = "Application and domain stay framework free"
type = "forbidden"
source_modules = ["eonarq.planning.command.application", "eonarq.planning.command.domain", "eonarq.planning.query.application", "eonarq.planning.query.domain", "eonarq.planning.common.domain", "eonarq.planning.common.application", "eonarq.shared_kernel.domain", "eonarq.shared_kernel.application"]
forbidden_modules = ["sqlalchemy", "fastapi", "starlette", "dishka", "mcp", "pydantic", "jinja2", "uvicorn"]
